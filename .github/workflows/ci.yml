name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    # TODO(#50): upload the test reports when a check fails.
    name: Lint, JVM and Android host tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck jvmTest testAndroidHostTest koverXmlReport --continue
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: kover-report
          path: "**/build/reports/kover/report.xml"

  macos:
    # TODO(#51): cache ~/.konan/dependencies.
    name: Build every target, ABI and iOS simulator tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assemble checkKotlinAbi iosSimulatorArm64Test --continue
