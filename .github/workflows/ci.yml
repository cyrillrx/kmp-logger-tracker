name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, JVM and Android tests, ABI, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck jvmTest testAndroidHostTest checkKotlinAbi koverXmlReport --continue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kover-report
          path: "**/build/reports/kover/report.xml"
          if-no-files-found: ignore

  ios:
    name: Build every target, iOS ABI and simulator tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assemble checkKotlinAbi iosSimulatorArm64Test --continue
